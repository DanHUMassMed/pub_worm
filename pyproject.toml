[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pub-worm"
dynamic = ["version"]
description = "Wormbase/PubMed/Ensembl/BioRxiv/ORCID API Access"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Dan Higgins", email = "daniel.higgins@yahoo.com" }
]
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.5",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.3",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "types-aiofiles>=24.1.0",
    "types-requests>=2.31.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "types-aiofiles>=24.1.0",
    "types-requests>=2.31.0",
]

[tool.hatch.version]
path = "pub_worm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pub_worm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821", "F841", "E722"]

